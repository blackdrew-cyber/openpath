name: Discover OPENPATH opportunities

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC = 08:00 Ghana time

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out OPENPATH
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Discover new opportunity leads
        run: python collector.py
      - name: Save new leads to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opportunities.json
          if git diff --cached --quiet; then
            echo "No new leads to save."
          else
            git commit -m "Add discovered OPENPATH opportunity leads"
            git push
          fi
